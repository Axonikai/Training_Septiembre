   const delta=pts[pts.length-1].v-pts[0].v;
   h+=`<div class="cd"><div class="row" style="margin-bottom:6px"><span style="font-size:11px;font-weight:800;color:${f.c}">${f.lb}</span><span style="font-size:11px;font-weight:700;font-family:monospace;color:${delta<0?'var(--gn)':delta>0?'var(--rd)':'var(--t2)'}">${delta>0?'+':''}${delta.toFixed(1)}</span></div><svg viewBox="0 0 ${pts.length*50} 60" style="width:100%;height:50px">`;
   pts.forEach((p,i)=>{const x=i*50+25,y=55-((p.v-mn)/rng)*45;if(i>0){const px=(i-1)*50+25,py=55-((pts[i-1].v-mn)/rng)*45;h+=`<line x1="${px}" y1="${py}" x2="${x}" y2="${y}" stroke="${f.c}" stroke-width="2" opacity=".7"/>`;}h+=`<circle cx="${x}" cy="${y}" r="3" fill="${f.c}"/><text x="${x}" y="${y-6}" fill="var(--t2)" font-size="7" text-anchor="middle">${p.v}</text>`;});
   h+=`</svg></div>`;
  });
 }
 h+=`<span class="lb">Rangos</span><div class="cd" style="font-size:11px;color:var(--t2);line-height:2">Peso: <span style="color:var(--ac);font-weight:700">90-95</span> · IMC: <span style="color:var(--ac)">&lt;27</span> · Grasa: <span style="color:var(--gn)">15-20%</span> · Músculo: <span style="color:var(--gn)">&gt;38kg</span> · Agua: <span style="color:var(--gn)">50-65%</span> · MB: <span style="color:var(--ac)">~2050</span></div>`;
 $('t3').innerHTML=h;
}

function renderSept(){
 const dow1=new Date(2026,8,1).getDay();
 let h=`<span class="lb">Septiembre 2026</span><div class="cal">`;
 ['D','L','M','X','J','V','S'].forEach(d=>h+=`<div class="dh">${d}</div>`);
 for(let i=0;i<dow1;i++)h+=`<div class="empty"></div>`;
 for(let i=1;i<=30;i++){
  const k='2026-09-'+pad(i),dd=cache[k]||{};
  const has=dd.meals||dd.sessions?.length||dd.body?.peso;
  h+=`<button class="dy${k===td?' today':''}${k===selDate?' sel':''}${has?' has':''}" onclick="selDate='${k}';switchTab(0)">${i}</button>`;
 }
 h+=`</div>`;

 const p=SEPT[selDate],pl=MEALS[selDate]||{};
 if(p){
  h+=`<span class="lb">Plan del día</span><div class="wk-card"><div class="row"><h3>${p.t}</h3><span class="tag tag-${p.tc}">${p.tag}</span></div>`;
  if(p.run)h+=`<div class="note">🏃 ${p.run}</div>`;
  if(p.pd)h+=`<div class="note">🎾 Pádel ${p.pd}</div>`;
  h+=`<div style="margin-top:8px;font-size:11px;color:var(--t2)">`;
  p.ex.slice(0,4).forEach(e=>h+=e.n+'<br>');
  if(p.ex.length>4)h+=`<span style="color:var(--t3)">+${p.ex.length-4} más</span>`;
  h+=`</div></div>`;
 }
 if(pl.b){const b=BK.find(x=>x.id===pl.b),d=DN.find(x=>x.id===pl.d);
  h+=`<div class="cd"><div style="font-size:10px;color:var(--or);font-weight:700">☀️ Desayuno</div><div style="font-size:12px">${b?b.nm:''} <span style="color:var(--t2);font-size:10px">${b?b.kc+'kcal':''}</span></div><div style="border-top:1px solid var(--c2);margin-top:6px;padding-top:6px"><div style="font-size:10px;color:var(--or);font-weight:700">🌙 19:00</div><div style="font-size:12px">${d?d.nm:''} <span style="color:var(--t2);font-size:10px">${d?d.kc+'kcal':''}</span></div></div></div>`;
 }

 h+=`<span class="lb">Historial</span>`;
 Object.keys(cache).sort().reverse().slice(0,10).forEach(k=>{
  const d=cache[k],sc=(d.sessions||[]).length,su=Object.values(d.supps||{}).filter(Boolean).length;
  h+=`<div class="cd" style="padding:8px 12px;cursor:pointer" onclick="selDate='${k}';switchTab(0)"><div class="row"><div><div style="font-size:12px;font-weight:700">${k.slice(5)}</div><div style="font-size:10px;color:var(--t2)">${d.meals?'🍽️ ':''}${sc?'🏋️×'+sc+' ':''}${su?'💊'+su+'/4 ':''}${d.body?.peso?'📱':''}</div></div>${d.body?.peso?`<span style="font-size:12px;font-weight:700;font-family:monospace;color:var(--ac)">${d.body.peso}kg</span>`:''}</div></div>`;
 });
 $('t4').innerHTML=h;
}

// ═══════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════
function togSupp(id){const dd=gdd(selDate);dd.supps=dd.supps||{};dd.supps[id]=!dd.supps[id];sdd(selDate,dd);}
function togEx(i){const dd=gdd(selDate);dd.exDone=dd.exDone||{};dd.exDone['e'+i]=!dd.exDone['e'+i];sdd(selDate,dd);}
function pickMeal(slot,id){const dd=gdd(selDate);dd.meals=dd.meals||{};dd.meals[slot]=id;sdd(selDate,dd);}
function saveBody(f,v){const dd=gdd(selDate);dd.body=dd.body||{};dd.body[f]=parseFloat(v)||'';sdd(selDate,dd);}
function saveNotes(v){const dd=gdd(selDate);dd.notes=v;sdd(selDate,dd);}

function showSportAdd(){
 const el=$('spa');if(!el)return;
 window._sp='padel';
 let h=`<div class="cd" style="border-color:#163330"><div class="sp-grid">`;
 SP.forEach(s=>h+=`<button class="sp-btn${s.id==='padel'?' on':''}" id="sp${s.id}" onclick="window._sp='${s.id}';document.querySelectorAll('.sp-btn').forEach(b=>b.classList.remove('on'));this.classList.add('on')"><div class="i">${s.icon}</div>${s.name}</button>`);
 h+=`</div><div style="display:flex;gap:8px;margin-bottom:10px"><div style="flex:1"><div style="font-size:9px;color:var(--t3);margin-bottom:4px">MIN</div><input type="number" id="spd" value="60"></div><div style="flex:1"><div style="font-size:9px;color:var(--t3);margin-bottom:4px">INT</div><select id="spi"><option value="1">Baja</option><option value="2" selected>Media</option><option value="3">Alta</option></select></div></div>`;
 h+=`<div style="display:flex;gap:6px"><button class="btn-s" onclick="addSess()">Guardar</button><button class="btn-s btn-o" onclick="render()">Cancelar</button></div></div>`;
 el.innerHTML=h;
}

function addSess(){
 const dd=gdd(selDate);dd.sessions=dd.sessions||[];
 const dur=parseInt($('spd').value)||60,int=parseInt($('spi').value)||2;
 const sp=SP.find(s=>s.id===window._sp);
 dd.sessions.push({sport:window._sp,dur,int:int,kc:sp?Math.round(sp.cpm*dur*(int/2)):0,id:Date.now()});
 sdd(selDate,dd);
}
function rmSess(i){const dd=gdd(selDate);dd.sessions.splice(i,1);sdd(selDate,dd);}
</script>
